name: Windows Signed Release

on:
  workflow_dispatch:
    inputs:
      skip-backend-tests:
        description: "Skip backend tests while packaging the sidecar."
        type: boolean
        required: true
        default: false
      release-tag:
        description: "GitHub Release tag to publish assets to. Required when running from a branch."
        type: string
        required: false
        default: ""

# Two jobs, split by what they may run and what they may hold (U-2 in
# docs/UPDATER_AUDIT.md). The build runs code this repository does not own:
# npm ci runs the install scripts of the whole dependency tree, Maven runs its
# plugins, and the Tauri build runs vite's plugins and every crate's build
# script. So it holds no updater key and no write permission. The publish job
# holds the updater signing key, the OIDC token behind the provenance
# attestation and the token that writes the release, on a fresh runner that
# runs none of that code. Until 2026-11-02 one job held all of it, the key in
# its env; scoping the key to one step would not have been enough, because an
# earlier step on the same runner can plant what that step then runs — a
# NODE_OPTIONS in GITHUB_ENV, a node on GITHUB_PATH, an edited signer under
# node_modules.
permissions:
  contents: read

concurrency:
  group: windows-signed-release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build-signed-windows:
    name: Build signed Windows app
    runs-on: windows-latest
    permissions:
      contents: read
    outputs:
      release-tag: ${{ steps.tag.outputs.release-tag }}

    # Nothing here is private except the Authenticode certificate, which is set
    # on the two steps that detect and import it. The pubkey and the thumbprint
    # name a key rather than hold one, and the OAuth values ship inside the
    # installer (see below).
    env:
      WINDOWS_CERTIFICATE_THUMBPRINT: ${{ secrets.WINDOWS_CERTIFICATE_THUMBPRINT }}
      WINDOWS_DIGEST_ALGORITHM: ${{ vars.WINDOWS_DIGEST_ALGORITHM }}
      WINDOWS_TIMESTAMP_URL: ${{ vars.WINDOWS_TIMESTAMP_URL }}
      TAURI_UPDATER_PUBKEY: ${{ secrets.TAURI_UPDATER_PUBKEY }}
      TAURI_UPDATER_ENDPOINTS: ${{ vars.TAURI_UPDATER_ENDPOINTS }}
      # Optional override of the beta-channel manifest URL compiled into the
      # app (option_env! in frontend/src-tauri/src/lib.rs). Unset ⇒ the
      # hardcoded default releases/download/beta/latest.json applies, so the
      # Actions var only exists if the URL ever needs to move.
      TAURI_UPDATER_BETA_ENDPOINT: ${{ vars.TAURI_UPDATER_BETA_ENDPOINT }}
      TAURI_UPDATER_WINDOWS_INSTALL_MODE: ${{ vars.TAURI_UPDATER_WINDOWS_INSTALL_MODE }}
      # Enable the on-startup auto-update check in released builds. Vite bakes this
      # flag in at build time; the check only runs in PROD Tauri builds (gated in
      # frontend/src/lib/updates.ts) and only finds anything once a release is
      # published with latest.json at the updater endpoint. Manual "check for
      # updates" works regardless of this flag.
      VITE_ENABLE_AUTO_UPDATE_CHECK: '1'
      # OAuth client identifiers baked into the sidecar launcher by
      # package-sidecar-windows.ps1. Microsoft is a public client (no secret);
      # Google's "Desktop app" secret is non-confidential (shipped, PKCE-protected).
      # All three are stored as Actions secrets so they are masked in build logs.
      GOOGLE_OAUTH_CLIENT_ID: ${{ secrets.GOOGLE_OAUTH_CLIENT_ID }}
      GOOGLE_OAUTH_CLIENT_SECRET: ${{ secrets.GOOGLE_OAUTH_CLIENT_SECRET }}
      MICROSOFT_OAUTH_CLIENT_ID: ${{ secrets.MICROSOFT_OAUTH_CLIENT_ID }}

    steps:
      # checkout would otherwise leave the job's token in .git/config for every
      # later step to read. Nothing needs it there: the tag gate's ls-remote
      # reads a public repository.
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Resolve release tag
        id: tag
        shell: pwsh
        # Values originating outside this file are read through env:, never
        # interpolated into the script. Git refname rules allow backticks,
        # dollar signs, semicolons and quotes, so a "${{ }}" expansion inside
        # a run: block is executable code in a job that holds contents: write
        # and the updater signing key — U-1 in docs/UPDATER_AUDIT.md. The
        # boolean input further down cannot carry such a value; it is read the
        # same way so that no reader has to work out which of the
        # interpolations were the safe ones.
        env:
          RELEASE_TAG_INPUT: ${{ inputs['release-tag'] }}
          REF_TYPE: ${{ github.ref_type }}
          REF_NAME: ${{ github.ref_name }}
        run: |
          $tag = "$env:RELEASE_TAG_INPUT".Trim()
          if ([string]::IsNullOrWhiteSpace($tag)) {
            if ($env:REF_TYPE -ne "tag") {
              throw "release-tag input is required when this workflow is not running from a tag."
            }
            $tag = $env:REF_NAME
          }

          # latest.json embeds a download URL built from this tag while its
          # version field comes from tauri.conf.json — a mismatch ships a
          # manifest whose installer URL 404s. Fail fast instead.
          $version = (Get-Content -Raw frontend/src-tauri/tauri.conf.json | ConvertFrom-Json).version
          if (($tag -replace '^v', '') -ne $version) {
            throw "Release tag $tag does not match app version $version (tauri.conf.json)."
          }

          # The tag must already exist on origin and point at the commit being
          # built. Without it, "Publish GitHub Release assets" below creates a
          # draft whose target_commitish is the default branch, and publishing
          # that draft creates the tag from wherever main points at that moment
          # -- a tree this run never built, under a tag that cannot be moved
          # once published (RELEASE_PROCESS step 3). A tag at another commit is
          # the same failure one step later: assets from this commit published
          # under a tag that names a different tree. Until 2026-09-13 only the
          # process document guarded either; a branch run with release-tag set
          # passed straight through.
          $refs = @(git ls-remote origin "refs/tags/$tag" "refs/tags/$tag^{}")
          if ($LASTEXITCODE -ne 0) { throw "Could not read tags from origin." }
          if ($refs.Count -eq 0) {
            throw "Tag $tag does not exist on origin. Create and push it first (RELEASE_PROCESS step 3), then run this workflow from it."
          }
          $peeled = $refs | Where-Object { $_ -match '\^\{\}$' } | Select-Object -First 1
          $tagCommit = (($peeled ?? $refs[0]) -split '\s+')[0]
          if ($tagCommit -ne $env:GITHUB_SHA) {
            throw "Tag $tag points at $tagCommit, but this run builds $env:GITHUB_SHA. Run the workflow from the tag."
          }

          "release-tag=$tag" | Out-File -FilePath $env:GITHUB_OUTPUT -Append -Encoding utf8
          Write-Host "Publishing release assets to tag $tag"

      - name: Setup Node
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 26
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Setup Java
        uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad # v6.1.0
        with:
          distribution: temurin
          java-version: 25
          cache: maven

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable

      - name: Install frontend dependencies
        working-directory: frontend
        run: npm ci

      - name: Package backend sidecar
        working-directory: backend
        shell: pwsh
        # Packaged the same way as the dev sidecar. Release builds trained a JEP
        # 483 AOT cache here until 2026-11-01; on JDK 25 such a cache breaks the
        # start on every machine but the build machine (JDK-8376576), so it is
        # off until the runtime has the fix -- see the jpackage step of
        # package-sidecar-windows.ps1.
        env:
          SKIP_BACKEND_TESTS: ${{ inputs['skip-backend-tests'] }}
        run: |
          # OAuth config is required by default (the script fails on a missing /
          # placeholder client-id); no flag needed. -AllowPlaceholderOAuth is the
          # local-only opt-out and must never appear here.
          $args = @("-File", "scripts/package-sidecar-windows.ps1")
          if ($env:SKIP_BACKEND_TESTS -eq "true") {
            $args += "-SkipTests"
          }
          & pwsh @args

      - name: Sync backend sidecar into Tauri bundle
        working-directory: frontend
        run: npm run sidecar:sync:windows -- ..\backend\target\sidecar\x86_64-pc-windows-msvc src-tauri\binaries

      # Release gate: launch the packaged sidecar headless and assert the CORS
      # contract through the real WebView2 origin (http://tauri.localhost). A
      # `tauri dev` run / backend-only probe cannot catch an allowlist
      # regression because the webview origin only exists in a bundle — this is
      # the integration counterpart to SecurityConfigTest. Runs before signing
      # so a broken build fails fast.
      - name: Packaged sidecar smoke
        working-directory: frontend
        run: npm run tauri:smoke:sidecar

      # Authenticode signing is optional for this OSS build (no paid cert). When
      # the certificate secret is absent the installer ships unsigned and
      # authenticity rests on the build-provenance attestation + updater
      # signature. Secrets are not readable in step `if:` conditions, so surface
      # availability as a step output first.
      - name: Detect signing certificate
        id: signing
        shell: pwsh
        env:
          WINDOWS_CERTIFICATE_BASE64: ${{ secrets.WINDOWS_CERTIFICATE_BASE64 }}
        run: |
          $available = -not [string]::IsNullOrWhiteSpace($env:WINDOWS_CERTIFICATE_BASE64)
          "available=$($available.ToString().ToLower())" | Out-File -FilePath $env:GITHUB_OUTPUT -Append
          Write-Host "Authenticode signing available: $available"

      # Once imported, the certificate's private key is in the runner's store
      # for the rest of the job, the Tauri build included, which signs through
      # it. No certificate is configured today (AR-4 in SECURITY_THREAT_MODEL.md);
      # adding one should move Authenticode signing into the publish job, as the
      # updater signature was.
      - name: Import Windows code signing certificate
        if: steps.signing.outputs.available == 'true'
        shell: pwsh
        env:
          WINDOWS_CERTIFICATE_BASE64: ${{ secrets.WINDOWS_CERTIFICATE_BASE64 }}
          WINDOWS_CERTIFICATE_PASSWORD: ${{ secrets.WINDOWS_CERTIFICATE_PASSWORD }}
        run: |
          if ([string]::IsNullOrWhiteSpace($env:WINDOWS_CERTIFICATE_BASE64)) {
            throw "WINDOWS_CERTIFICATE_BASE64 secret is required."
          }
          if ([string]::IsNullOrWhiteSpace($env:WINDOWS_CERTIFICATE_PASSWORD)) {
            throw "WINDOWS_CERTIFICATE_PASSWORD secret is required."
          }
          if ([string]::IsNullOrWhiteSpace($env:WINDOWS_CERTIFICATE_THUMBPRINT)) {
            throw "WINDOWS_CERTIFICATE_THUMBPRINT secret is required."
          }

          $certificatePath = Join-Path $env:RUNNER_TEMP "windows-code-signing.pfx"
          [IO.File]::WriteAllBytes($certificatePath, [Convert]::FromBase64String($env:WINDOWS_CERTIFICATE_BASE64))
          $password = ConvertTo-SecureString -String $env:WINDOWS_CERTIFICATE_PASSWORD -Force -AsPlainText
          Import-PfxCertificate -FilePath $certificatePath -CertStoreLocation Cert:\CurrentUser\My -Password $password | Out-Null

      - name: Prepare Tauri release config
        working-directory: frontend
        run: npm run tauri:release-config:windows

      - name: Sign backend sidecar executable
        if: steps.signing.outputs.available == 'true'
        working-directory: frontend
        shell: pwsh
        run: .\scripts\sign-windows-file.ps1 -Path .\src-tauri\binaries\voxrox-mail-backend-x86_64-pc-windows-msvc.exe

      # The release config omits the Authenticode block when no certificate is
      # configured (see prepare-tauri-windows-release-config.mjs), so this signs
      # the bundle only when a cert is present. It produces no updater .sig:
      # the release config leaves createUpdaterArtifacts off, so the build does
      # not ask for the signing key, which this job does not have.
      - name: Build Tauri bundle
        working-directory: frontend
        run: npm run tauri:build -- --config src-tauri/tauri.release.conf.json

      - name: Verify signatures
        if: steps.signing.outputs.available == 'true'
        working-directory: frontend
        shell: pwsh
        run: |
          $paths = @(
            ".\src-tauri\binaries\voxrox-mail-backend-x86_64-pc-windows-msvc.exe",
            ".\src-tauri\target\release\bundle"
          )
          .\scripts\verify-windows-signatures.ps1 -Path $paths

      # What the publish job needs from this one: the installer, and the release
      # config it was built with, whose pubkey the signature is checked against.
      # Both paths lie under frontend/src-tauri, which becomes the artifact's
      # root, so downloading it there restores them in place.
      - name: Hand the installer to the publish job
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: windows-bundle
          path: |
            frontend/src-tauri/target/release/bundle/nsis/voxrox-mail-*-setup.exe
            frontend/src-tauri/tauri.release.conf.json
          if-no-files-found: error
          retention-days: 1

  publish-release:
    name: Sign and publish the release
    needs: build-signed-windows
    runs-on: windows-latest
    permissions:
      contents: write
      # Required by actions/attest-build-provenance: id-token for Sigstore OIDC,
      # attestations to record the provenance against the repository.
      id-token: write
      attestations: write
    env:
      RELEASE_TAG: ${{ needs.build-signed-windows.outputs.release-tag }}

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # No npm cache: the build job ran the dependency tree and could have
      # written one.
      - name: Setup Node
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 26

      # --ignore-scripts installs the tree, checked against the lockfile, without
      # running any of it. What this job runs is the Tauri CLI, which needs no
      # install script, and the repository's own dependency-free scripts.
      - name: Install frontend dependencies without running them
        working-directory: frontend
        run: npm ci --ignore-scripts

      - name: Download the installer
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: windows-bundle
          path: frontend/src-tauri

      # The one step that holds the updater signing key, and it runs nothing but
      # the Tauri CLI's signer over the finished installer, after Authenticode,
      # so the signature covers the file users download. --app-version binds the
      # version into the signature's trusted comment, as `tauri build` does when
      # it signs.
      - name: Sign installer for the updater
        working-directory: frontend
        shell: pwsh
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        run: |
          if ([string]::IsNullOrWhiteSpace($env:TAURI_SIGNING_PRIVATE_KEY)) {
            throw "TAURI_SIGNING_PRIVATE_KEY secret is required to create updater signatures."
          }
          $version = (Get-Content -Raw src-tauri/tauri.conf.json | ConvertFrom-Json).version
          $installers = @(Get-ChildItem -Path src-tauri/target/release/bundle/nsis -File -Filter "voxrox-mail-$version-windows-*-setup.exe")
          if ($installers.Count -ne 1) {
            throw "Expected one installer for $version in bundle/nsis, found $($installers.Count)."
          }
          node node_modules/@tauri-apps/cli/tauri.js signer sign --app-version $version $installers[0].FullName
          if ($LASTEXITCODE -ne 0) {
            throw "Signing $($installers[0].Name) for the updater failed."
          }

      - name: Generate Tauri updater manifest
        working-directory: frontend
        run: npm run tauri:generate-latest:windows

      # The one release property that cannot be repaired afterwards: the key
      # baked into the app must be the pair of the key that signed the
      # installer. The two halves come from unrelated secrets
      # (TAURI_UPDATER_PUBKEY vs TAURI_SIGNING_PRIVATE_KEY) and nothing else
      # compares them — a mismatched pair otherwise ships green and costs every
      # installation its updater, which no later update can fix. Reads the
      # generated config and manifest, so it judges what actually ships rather
      # than the env vars they came from.
      - name: Verify updater signature against the shipped pubkey
        working-directory: frontend
        run: npm run tauri:verify-updater-signature

      # Strong, free supply-chain authenticity for an OSS build with no paid
      # Authenticode certificate: a Sigstore-backed build-provenance attestation
      # cryptographically ties the installer to this workflow + commit. Unlike a
      # bare checksum (which an attacker who can rewrite the release rewrites too),
      # it is verifiable out-of-band with
      #   gh attestation verify <file> --repo ${{ github.repository }}
      - name: Attest installer build provenance
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: frontend/src-tauri/target/release/bundle/nsis/voxrox-mail-*-setup.exe

      - name: Upload signed Windows artifacts
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: mail-windows-signed-${{ github.run_number }}
          path: |
            frontend/src-tauri/target/release/bundle/**
            frontend/src-tauri/target/release/latest.json
          if-no-files-found: error

      - name: Publish GitHub Release assets
        working-directory: frontend
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $assets = @(
            Get-ChildItem -Path ".\src-tauri\target\release\bundle" -Recurse -File |
              Where-Object { $_.Name -match "^voxrox-mail-.+-setup\.exe(\.sig)?$" } |
              Select-Object -ExpandProperty FullName
          )
          $assets += (Resolve-Path ".\src-tauri\target\release\latest.json").Path

          if ($assets.Count -eq 0) {
            throw "No release assets found."
          }

          # Publish a SHA256 checksum next to each installer so users can verify
          # the download's integrity (`certutil -hashfile <file> SHA256` on
          # Windows, `sha256sum -c <file>.sha256` elsewhere). The .sig/latest.json
          # are updater-internal and not user-downloaded, so they are not hashed.
          foreach ($installer in @($assets | Where-Object { $_ -match "-setup\.exe$" })) {
            $hash = (Get-FileHash -Algorithm SHA256 -LiteralPath $installer).Hash.ToLower()
            $name = [System.IO.Path]::GetFileName($installer)
            $sumPath = "$installer.sha256"
            [System.IO.File]::WriteAllText($sumPath, "$hash *$name`n")
            $assets += $sumPath
            Write-Host "Checksum $name = $hash"
          }

          # A prerelease-suffixed version ships to the beta channel only:
          # the flag keeps it out of the releases/latest redirect (stable
          # channel) once published. beta-channel.yml then refreshes the
          # moving beta manifest on publish.
          #
          # PowerShell cannot import frontend/scripts/lib/semver.mjs, so this
          # regex re-states "has a prerelease suffix" from SEMVER_RE there —
          # keep the two in sync if the tag grammar ever changes.
          $isPrerelease = $env:RELEASE_TAG -match '^v?\d+\.\d+\.\d+-'

          gh release view $env:RELEASE_TAG | Out-Null
          if ($LASTEXITCODE -ne 0) {
            $createArgs = @("release", "create", $env:RELEASE_TAG, "--draft", "--title", "VoxRox Mail $env:RELEASE_TAG")
            if ($isPrerelease) {
              $createArgs += "--prerelease"
            }
            gh @createArgs
          }
          elseif ($isPrerelease) {
            # The release can pre-exist without the flag (operator-drafted
            # notes, or a prior partial run) — enforce it, or publishing would
            # hand the stable channel's releases/latest redirect to this build.
            gh release edit $env:RELEASE_TAG --prerelease
            if ($LASTEXITCODE -ne 0) {
              throw "Failed to mark pre-existing release $env:RELEASE_TAG as prerelease."
            }
          }

          gh release upload $env:RELEASE_TAG @assets --clobber
