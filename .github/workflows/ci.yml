name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

# Every job carries a timeout-minutes, and so do the three network installs --
# the apt step in the Tauri job and the browser download in each test job.
# Without them the GitHub default of 360 minutes applies, and a run that is
# never going to finish holds an armed auto-merge open for hours: #296 sat
# 80 minutes on "Install Tauri system deps" before anyone restarted it by hand.
#
# A job limit is a backstop against a wedged run, not a performance budget, so
# every number here sits well above the slowest run that actually passed rather
# than near it. Set it near the ceiling and it stops catching hangs and starts
# failing honest work: the ceiling is not where the typical run is. Tauri (Rust)
# is the clearest case -- it is bimodal on the cargo cache, a couple of minutes
# on a hit and far longer on a miss, and a miss is routine rather than exotic
# (any Cargo.lock or toolchain bump causes one). Before lowering any of these,
# re-measure the max over recent *successful* runs, and measure the job, not one
# step: the limit bounds checkout, dependency install and build as well.
#
# Only the Tauri step still needs apt, and it genuinely does -- libwebkit2gtk is
# not on the runner image. The test jobs left apt entirely: playwright install
# runs without --with-deps, which on this image pulled no browser library at all
# -- they are already present -- only font packages for CJK, Thai and Cyrillic,
# and it bought them through apt, the one unreliable thing in this workflow.
# What is left there is the Playwright CDN download, fast in every log we have.
# If a test ever needs one of those scripts rendered, the fonts come back as
# their own explicit step rather than as a side effect of installing a browser.
#
# The apt step is bounded per attempt and then retried, because a bound alone is
# only half of it: a flat cut turns "slow but green" into "fast red" with nothing
# to recover it, which with auto-merge armed is worse than the wait it replaced.
# A fresh connection usually lands on a healthy mirror backend, so the retry is
# what recovers and the bound is what keeps a bad attempt from running away.
#
# Known limit, narrowed but not closed: when the mirror stays degraded longer
# than the whole retry budget, this still ends red where the old unbounded step
# ended green. Acquire::http::Timeout (see the step) now cuts the case that
# actually produced that red -- a single connection going silent mid-fetch --
# inside the attempt instead of costing the whole attempt. Pinning a mirror was
# the other candidate and is deliberately not done: sources on this image are a
# mirrorlist (file:/etc/apt/apt-mirrors.txt), the host apt fails over to is the
# one that then stalled, and dropping either entry trades away the failover that
# got the attempt as far as it did to save ~38s of rediscovery per attempt.
#
# The packages themselves come from the Actions cache when it has them, which is
# what narrows that limit to the index. On 2026-10-26 three runs went red here
# (#793, #794, #796) on the same shape: the 12.6 MB of indexes arrived in 1-7s,
# then the 63.7 MB of packages came at 13-82 kB/s in every one of the nine
# attempts, against 3.8-15 MB/s in the reruns that passed. A fresh connection
# did not land anywhere faster, so the retry had nothing to recover. With apt's
# archive seeded from the cache, apt-get install has nothing left to fetch.
# apt-get update still asks the mirror and still decides what is installed, so
# a cached run installs exactly what an uncached one would today: the cache
# changes where the bytes come from, never which ones. A miss, or a version the
# cache does not hold yet, is fetched from the mirror under the same retry.
#
# dpkg --configure -a runs between apt attempts because timeout kills apt with
# SIGTERM. The stalls seen so far were all in the fetch phase, where there is
# nothing half-configured to repair, but an attempt cut during unpack would
# otherwise leave the next one to fail on a broken package state.
jobs:
  backend:
    name: Backend quality
    runs-on: ubuntu-latest
    timeout-minutes: 12
    defaults:
      run:
        working-directory: backend
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Java
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: 25
          cache: maven

      # The spotless <eclipse> step provisions Eclipse JDT via P2 from
      # download.eclipse.org. The composite-repo metadata expires from the
      # local P2 cache (~/.m2/repository/dev/equo/p2-data), so even a warm
      # Maven cache hits the network, and transient CDN errors (e.g.
      # okhttp3 StreamResetException: INTERNAL_ERROR) fail the step.
      # Retry with backoff (30 s, then 60 s) before failing the job.
      - name: Check formatting
        run: |
          for attempt in 1 2 3; do
            if mvn --batch-mode spotless:check; then
              exit 0
            fi
            if [ "$attempt" -lt 3 ]; then
              delay=$((attempt * 30))
              echo "spotless:check failed (attempt $attempt/3); retrying in ${delay}s..."
              sleep "$delay"
            fi
          done
          echo "spotless:check failed after 3 attempts"
          exit 1

      # Runs on the runner's preinstalled Node — the script has no npm deps.
      - name: Translation whitelist lint
        run: node ../frontend/scripts/check-translation-whitelist.mjs --target=backend --mode=strict

      # Same — no npm deps. Guards cs/en key + placeholder parity and that
      # messages.properties stays identical to the Czech base bundle.
      - name: Backend i18n key parity
        run: node ../frontend/scripts/check-backend-i18n-keys.mjs

      # `mvn verify` runs unit + integration tests AND spotbugs:check (bound in
      # backend/pom.xml). One job step, one gate — matches what a local
      # `mvn verify` does, with one exception: MailSyncQresyncDovecotIT needs
      # Docker, which the runner has and a developer machine may not, and it
      # skips itself without it. A green local build without Docker therefore
      # says nothing about that test.
      - name: Run unit + integration tests + SpotBugs
        run: mvn --batch-mode verify

      - name: Upload coverage report (unit + IT merged)
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: backend-coverage
          path: |
            backend/target/site/jacoco/
            backend/target/site/jacoco-merged/
          retention-days: 14
          if-no-files-found: warn

  tauri:
    name: Tauri (Rust)
    runs-on: ubuntu-latest
    # High on purpose: a cargo cache miss is what this has to clear, and it is
    # several times a cache hit. See the note above jobs: before lowering it.
    timeout-minutes: 35
    defaults:
      run:
        working-directory: frontend/src-tauri
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      # Entries are named after the files they hold (see Collect apt archives),
      # so no exact key exists to ask for: the prefix takes the newest entry,
      # whichever set of versions that is. A cache that cannot be reached must
      # cost no more than the mirror it stands in for, so a stalled download is
      # abandoned after a minute and the step may fail -- both mean a miss, and
      # the install below goes to the mirror as it did before this cache.
      - name: Restore apt archive cache
        id: apt-cache
        uses: actions/cache/restore@v6
        timeout-minutes: 3
        continue-on-error: true
        env:
          SEGMENT_DOWNLOAD_TIMEOUT_MINS: 1
        with:
          path: ~/apt-archives
          key: apt-archives-${{ runner.os }}-
          restore-keys: apt-archives-${{ runner.os }}-

      - name: Install Tauri system deps
        # Clear of the loop's own worst case below, with room for dpkg to do real
        # work, so an exhausted retry reports through its exit 1 rather than being
        # cut here -- the three warnings are the whole diagnostic value.
        timeout-minutes: 13
        run: |
          # apt counts a file already in its archive as downloaded when name and
          # size match the index entry, and fetches everything else as before. A
          # file of the wrong size is deleted and fetched again, so a truncated
          # entry costs a download, not the install.
          if [ -d ~/apt-archives ]; then
            echo "Seeding apt's archive with $(ls ~/apt-archives | wc -l) cached files"
            sudo cp ~/apt-archives/*.deb /var/cache/apt/archives/
          fi

          # Acquire Timeout bounds a connection that has gone silent, which is what
          # the 200s cap was really catching. In run 32295477243 attempt 1 fetched
          # the InRelease files by 20:04:48 and then printed nothing at all until
          # the kill at 20:07:30 -- 162s of one stalled transfer, and the attempt
          # lost to it. apt's own default is 120s and every byte received restarts
          # the clock, so a mirror that trickles never trips it; 30s cuts a stalled
          # connection inside the attempt and lets a retry go again, which with a
          # mirrorlist can mean a different mirror.
          #
          # Both schemes are set on purpose. The stall was on an https URL --
          # https://archive.ubuntu.com, the mirror apt had just failed over to --
          # and the https method resolves Acquire::https::Timeout, not the http
          # one, so setting only http would leave the very case this targets
          # unbounded. Retries is global rather than per-scheme, so it is set once;
          # it is already 3 on this image (the 1s/2s/4s backoff in that log is it)
          # and is spelled out so an image default cannot quietly change the worst
          # case, which is four tries of 30s on one item.
          apt_opts='-o Acquire::http::Timeout=30 -o Acquire::https::Timeout=30 -o Acquire::Retries=3'
          for attempt in 1 2 3; do
            status=0
            sudo timeout -k 10 200 bash -c "apt-get update $apt_opts && apt-get install -y $apt_opts libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf" || status=$?
            if [ "$status" -eq 0 ]; then
              exit 0
            fi
            # 124 is timeout's own exit, 137 the -k SIGKILL landing; anything else
            # came from apt. Saying "did not finish within 200s" for a 404 or a
            # renamed package -- which returns 100 in seconds -- sends the reader
            # after a network fault that was never there. Both cases are still
            # retried: apt returns 100 for the transient failures the retry exists
            # to absorb too, so the exit code cannot separate permanent from
            # recoverable on its own.
            case "$status" in
              124|137)
                echo "::warning::apt attempt ${attempt} of 3 did not finish within 200s"
                ;;
              *)
                echo "::warning::apt attempt ${attempt} of 3 failed with exit ${status} (not a timeout)"
                ;;
            esac
            # Between attempts only: after the last one there is no next attempt
            # to repair package state for, and the sleep only delayed the failure.
            if [ "$attempt" -lt 3 ]; then
              sudo dpkg --configure -a || true
              sleep 5
            fi
          done
          exit 1

      # Right after the install and before anything that fails for reasons of its
      # own, so a clippy finding does not cost the next run its cache. autoclean
      # drops each file the index no longer offers -- every version an update has
      # superseded -- so the entry follows the archive instead of growing with
      # each security release. The key is the list of file names, and a name
      # carries the package's version: a run that fetched nothing new computes
      # the key it restored and saves nothing, one that fetched a new version
      # saves a new entry once. No file at all (everything already on the image)
      # means no key and no save, rather than an empty entry.
      - name: Collect apt archives
        id: apt-archives
        run: |
          sudo apt-get autoclean
          rm -rf ~/apt-archives
          mkdir ~/apt-archives
          find /var/cache/apt/archives -maxdepth 1 -name '*.deb' -exec cp -t ~/apt-archives {} +
          files=$(LC_ALL=C ls ~/apt-archives)
          if [ -n "$files" ]; then
            echo "Collected $(echo "$files" | wc -l) files, $(du -sh ~/apt-archives | cut -f1)"
            echo "key=apt-archives-${RUNNER_OS}-$(echo "$files" | sha256sum | cut -c1-16)" >> "$GITHUB_OUTPUT"
          fi

      # Who can write an entry main reads is the same as for the Cargo cache
      # below: runs on main. A pull request saves into its own scope only. A save
      # that fails or stalls leaves this run as it was, so it may not fail it.
      - name: Save apt archive cache
        if: steps.apt-archives.outputs.key != '' && steps.apt-archives.outputs.key != steps.apt-cache.outputs.cache-matched-key
        uses: actions/cache/save@v6
        timeout-minutes: 3
        continue-on-error: true
        with:
          path: ~/apt-archives
          key: ${{ steps.apt-archives.outputs.key }}

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt

      # Runs before the stub and cache steps on purpose: rustfmt parses, it does
      # not build, so it needs neither and it is the cheapest thing here to fail
      # on. Rust was the only language in this repo without a formatting gate —
      # the frontend has prettier, the whole tree has check:md, the backend has
      # Spotless — and by the time this was added the crate had drifted from
      # rustfmt in four places nobody had reason to notice.
      - name: cargo fmt
        run: cargo fmt --check

      # The sidecar (externalBin "binaries/voxrox-mail-backend") and the bundled resources
      # ("binaries/app", "binaries/runtime") are Windows-only artifacts produced
      # by the release packaging job; they do not exist on this Linux runner.
      # tauri-build validates their existence in the build script, so stub them
      # before cargo check — static analysis (check/clippy/audit) validates the
      # Rust crate and never reads the stub contents. resources/NOTICE.txt is
      # committed, so it needs no stub.
      - name: Stub sidecar and resources for static checks
        run: |
          install -Dm755 /dev/null binaries/voxrox-mail-backend-x86_64-unknown-linux-gnu
          mkdir -p binaries/app binaries/runtime
          : > binaries/app/.stub
          : > binaries/runtime/.stub

      - name: Cache Cargo
        uses: actions/cache@v6
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            frontend/src-tauri/target
          key: cargo-${{ runner.os }}-${{ hashFiles('frontend/src-tauri/Cargo.lock') }}
          restore-keys: |
            cargo-${{ runner.os }}-

      - name: cargo check
        run: cargo check

      - name: cargo clippy
        run: cargo clippy --no-deps -- -D warnings

      # The one Rust test CI runs. The redactor of the Save logs ZIP must write what
      # the backend's DiagnosticLogRedactor writes, and both run the vectors in
      # backend/src/test/resources/diagnostic/redaction-vectors.json: Backend
      # quality runs the Java half, this the Rust half, so a rule changed in one and
      # not the other fails here or there (docs/API_SURFACE_AUDIT.md, A4). The other
      # Rust tests stay local, as before. Building the crate for test costs more than
      # cargo check on a cold cache; the cache above keeps it once a Cargo.lock
      # change has saved a cache with it.
      - name: cargo test (log redactor)
        # Quoted: a plain scalar ending in ':' reads as a mapping key.
        run: "cargo test --lib -- redact::"

      - name: Cache cargo-audit binary
        id: cargo-audit-cache
        uses: actions/cache@v6
        with:
          path: ~/.cargo/bin/cargo-audit
          key: cargo-audit-0.22.2-${{ runner.os }}

      - name: Install cargo-audit
        if: steps.cargo-audit-cache.outputs.cache-hit != 'true'
        run: cargo install cargo-audit --version 0.22.2 --locked

      # Fails only on `vulnerability` advisories (cargo-audit default). Accepted
      # unmaintained/unsound warnings live in frontend/src-tauri/.cargo/audit.toml.
      - name: cargo audit (RustSec)
        run: cargo audit

  lint:
    name: Lint
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: frontend
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version: 26
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: npm ci

      # Through the gate script rather than `npm audit` directly: npm returns the
      # same non-zero exit for "found something" and "could not reach the
      # advisory registry", so one 503 used to fail this job and block the merge
      # with no way through but a rerun. The script judges the JSON instead of
      # the exit code, retries only the no-verdict case, and still fails closed
      # when every attempt comes back empty. See scripts/npm-audit-gate.mjs.
      - name: Audit npm dependencies
        run: npm run audit:ci

      - name: Run lint
        run: npm run lint

      - name: Dead-code analysis (knip)
        run: npm run knip

      # Second pass with the test files out of the graph: an export the app
      # itself no longer calls stays green above as long as its own test still
      # imports it.
      - name: Dead-code analysis, production graph (knip)
        run: npm run knip:production

  check:
    name: Svelte check
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: frontend
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          # check:audits resolves the `Audited commit` SHA of every security
          # audit against history. The default shallow clone has neither those
          # commits nor the range between them, so the check would report every
          # audit as unresolvable.
          fetch-depth: 0

      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version: 26
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Check API schema drift
        run: npm run check:api

      - name: Translation whitelist lint
        run: npm run check:translations:strict

      - name: Run check
        run: npm run check

      # Advisory-shaped but enforced: a change to an egress- or storage-relevant
      # path must either update the privacy policy or say in a commit trailer
      # why it does not. See scripts/check-docs-impact.mjs.
      - name: Docs impact
        run: >-
          npm run check:docs-impact --
          --base ${{ github.event_name == 'pull_request'
          && github.event.pull_request.base.sha
          || github.event.before }}

      # A rename leaves its old name in comments, @DisplayName strings and test
      # names, where no compiler looks. Checks the change, not the tree, because
      # that is the moment the answer is cheap. See scripts/check-rename-residue.mjs.
      - name: Rename residue
        run: >-
          npm run check:rename-residue --
          --base ${{ github.event_name == 'pull_request'
          && github.event.pull_request.base.sha
          || github.event.before }}

  test-unit:
    name: Frontend unit tests
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: frontend
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version: 26
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Run unit tests with coverage
        run: npm run test:unit:coverage

      - name: Upload coverage report
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: frontend-coverage
          path: frontend/coverage/
          retention-days: 14
          if-no-files-found: warn

  test-functional:
    name: Functional tests
    runs-on: ubuntu-latest
    # Bounds npm ci, the vite build inside run-playwright-with-preview.mjs and
    # the suite together -- not just the test step it is easy to read it as.
    timeout-minutes: 25
    defaults:
      run:
        working-directory: frontend
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version: 26
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Install Playwright browser
        # Deliberately not --with-deps. On the runner image that installs nine
        # font packages and nothing else -- CJK, Thai and Cyrillic faces; every
        # actual Chromium library is already present -- and it buys them through
        # apt, which is the one genuinely unreliable thing in this workflow.
        # Dropping it takes apt out of both test jobs entirely and leaves the CDN
        # download, fast in every log we have. If a test ever needs one of those
        # scripts rendered, the fonts come back as their own explicit step rather
        # than as a side effect of installing a browser.
        timeout-minutes: 8
        run: |
          for attempt in 1 2; do
            if timeout -k 10 180 npx playwright install chromium; then
              exit 0
            fi
            echo "::warning::playwright download attempt ${attempt} of 2 did not finish within 180s"
            sleep 5
          done
          exit 1

      - name: Run functional tests
        run: npm run test:functional

      - name: Upload Playwright artifacts
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: functional-test-results
          path: frontend/test-results/
          if-no-files-found: ignore

  test-a11y:
    name: Accessibility tests
    runs-on: ubuntu-latest
    # Same shape as the functional job: its own work peaks lower, but the
    # browser download below can spend most of a step budget out of this one.
    timeout-minutes: 20
    defaults:
      run:
        working-directory: frontend
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version: 26
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Install Playwright browser
        # Deliberately not --with-deps. On the runner image that installs nine
        # font packages and nothing else -- CJK, Thai and Cyrillic faces; every
        # actual Chromium library is already present -- and it buys them through
        # apt, which is the one genuinely unreliable thing in this workflow.
        # Dropping it takes apt out of both test jobs entirely and leaves the CDN
        # download, fast in every log we have. If a test ever needs one of those
        # scripts rendered, the fonts come back as their own explicit step rather
        # than as a side effect of installing a browser.
        timeout-minutes: 8
        run: |
          for attempt in 1 2; do
            if timeout -k 10 180 npx playwright install chromium; then
              exit 0
            fi
            echo "::warning::playwright download attempt ${attempt} of 2 did not finish within 180s"
            sleep 5
          done
          exit 1

      - name: Run accessibility tests
        run: npm run test:a11y

      - name: Upload Playwright artifacts
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: a11y-test-results
          path: frontend/test-results/
          if-no-files-found: ignore

  backend-build:
    name: Backend build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: backend
    env:
      MAIL_CRYPTO_KEY: ci-only-dummy-crypto-key-must-be-32-chars-min
      MAIL_CRYPTO_SALT: ci-only-dummy-crypto-salt
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Java
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: 25
          cache: maven

      - name: Package JAR
        run: mvn --batch-mode -DskipTests package

      - name: Upload backend JAR
        uses: actions/upload-artifact@v7
        with:
          name: backend-jar
          path: backend/target/mail-backend-*.jar
          retention-days: 7
          if-no-files-found: error

  frontend-build:
    name: Frontend build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: frontend
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version: 26
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Build frontend
        run: npm run build

      - name: Upload frontend build
        uses: actions/upload-artifact@v7
        with:
          name: frontend-build
          path: frontend/build/
          retention-days: 7
          if-no-files-found: error
