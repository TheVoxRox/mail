# Dependabot configuration.
#
# Grouping policy: minor + patch updates are bundled into a small number of
# grouped PRs per ecosystem (production vs development where the ecosystem
# distinguishes them) to cut weekly PR volume and keep related tooling moving
# together. MAJOR updates are deliberately left OUT of every group so each one
# lands as its own PR for manual review — a lone major that outruns its peers
# (e.g. typescript ahead of typescript-eslint) is exactly the kind of
# breaking/peer-conflict change that must not be auto-bundled.
#
# Cooldown: every ecosystem waits until a release is seven days old before it
# proposes it. A compromised release is usually found and pulled within that
# window, and its code would otherwise run here on the first install of the
# dependabot branch, in CI and on the maintainer's machine. Security updates
# are not held back by it. Why seven days: docs/DECISIONS.md, "Dependabot
# proposes a release only once it is a week old".
version: 2
updates:
  - package-ecosystem: npm
    directory: /frontend
    schedule:
      interval: weekly
      day: monday
      time: '08:00'
      timezone: Europe/Prague
    open-pull-requests-limit: 5
    cooldown:
      default-days: 7
    groups:
      npm-production:
        dependency-type: production
        update-types:
          - minor
          - patch
      npm-development:
        dependency-type: development
        update-types:
          - minor
          - patch
    # TypeScript stays on 6.x until the tools that import its compiler API
    # take 7. The 7.x package is the native compiler: its root export is
    # lib/version.cjs, and the API moved under typescript/unstable/*. As of
    # 2026-11-16 three dev dependencies keep 7 out of their peer range, in
    # their latest releases too: typescript-eslint (`>=4.8.4 <6.1.0`),
    # svelte-check (`^5.0.0 || ^6.0.0`) and @sveltejs/kit (`^6.0.0`).
    # openapi-typescript builds its output with that API as well, but
    # package.json overrides its peer to our own typescript, so no peer range
    # speaks for it; `npm run check:api`, which generates the schema with it
    # in CI, does. The hold used to be an `@dependabot ignore` command on #147
    # (closed 2026-07-14), kept in dependabot's own state where nobody reading
    # this file could see it. Delete this entry once all three admit 7
    # (`npm view <name> peerDependencies`); dependabot then proposes it again.
    ignore:
      - dependency-name: typescript
        update-types:
          - version-update:semver-major

  - package-ecosystem: cargo
    directory: /frontend/src-tauri
    schedule:
      interval: weekly
      day: monday
      time: '08:30'
      timezone: Europe/Prague
    open-pull-requests-limit: 5
    cooldown:
      default-days: 7
    groups:
      cargo-minor-patch:
        update-types:
          - minor
          - patch
    # Three crates that move with Tauri, never on their own. webview2-com and
    # windows-core type the WebView2 controller Tauri hands out
    # (src/webview_defaults.rs), so a version wry does not build with fails to
    # compile on Windows; windows-registry is pinned to the copy Tauri already
    # brings (src/update_preference.rs), so a newer one adds a second crate.
    # The CI Rust job runs on Ubuntu and does not build cfg(windows) code, so
    # none of that shows on a dependabot PR (#539-#541, all green and all
    # broken or wrong). Bump them by hand in Cargo.toml together with the Tauri
    # update that moves them: `cargo tree -i webview2-com` shows wry's version.
    ignore:
      - dependency-name: webview2-com
        update-types:
          - version-update:semver-major
          - version-update:semver-minor
      - dependency-name: windows-core
        update-types:
          - version-update:semver-major
          - version-update:semver-minor
      - dependency-name: windows-registry
        update-types:
          - version-update:semver-major
          - version-update:semver-minor

  - package-ecosystem: maven
    directory: /backend
    schedule:
      interval: weekly
      day: monday
      time: '08:45'
      timezone: Europe/Prague
    open-pull-requests-limit: 5
    cooldown:
      default-days: 7
    groups:
      maven-production:
        dependency-type: production
        update-types:
          - minor
          - patch
      maven-development:
        dependency-type: development
        update-types:
          - minor
          - patch

  # Every action is pinned to a full commit SHA with its release in a trailing
  # comment (`@<sha> # v7.0.1`), so a moved or rewritten tag cannot change what
  # runs; dependabot updates the SHA and the comment together. The exception it
  # cannot follow is dtolnay/rust-toolchain, pinned to its `stable` branch,
  # which has no release tags: re-pin it by hand (`git ls-remote` on the branch).
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
      day: monday
      time: '09:00'
      timezone: Europe/Prague
    open-pull-requests-limit: 5
    cooldown:
      default-days: 7
    groups:
      github-actions-minor-patch:
        update-types:
          - minor
          - patch
